<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Case Study Studio</title><style>
:root{--bg:#1e222a;--panel:#2a2f3a;--line:#3a4150;--tx:#f0f2f5;--soft:#9aa3b2;--red:#e03131}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,sans-serif}
main{max-width:980px;margin:0 auto;padding:20px 16px 80px}h1,h2{margin:.2em 0}a{color:#ff8787}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin:14px 0}
input,textarea,select{width:100%;background:#171a20;color:var(--tx);border:1px solid var(--line);border-radius:6px;padding:9px;font:inherit}
textarea{min-height:110px}button,.btn{background:var(--red);color:#fff;border:0;border-radius:6px;padding:9px 16px;font:inherit;cursor:pointer;text-decoration:none;display:inline-block}
button.sec,.btn.sec{background:#3a4150}button:disabled{opacity:.4}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pill{padding:2px 10px;border-radius:99px;background:#3a4150;font-size:13px}.ok{background:#2b8a3e}.flash{background:#5c2b2b;padding:10px;border-radius:6px;margin:10px 0}
pre{background:#12141a;padding:10px;border-radius:6px;overflow:auto;max-height:260px;font-size:12px;white-space:pre-wrap}
.fact{border-top:1px solid var(--line);padding:10px 0}.q{color:var(--soft);font-style:italic}.bar{height:10px;background:#171a20;border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--red);width:0}
video{width:100%;border-radius:8px;background:#000}small{color:var(--soft)}
</style></head><body><main>
<div class="row"><h1 style="flex:1"><a href="/" style="color:inherit;text-decoration:none">Case Study Studio</a></h1>
{% if session.ok %}<span class="pill">{{quality|upper}}</span><form method="post" action="/logout"><input type="hidden" name="csrf" value="{{csrf}}"><button class="sec">Sign out</button></form>{% endif %}</div>
{% for m in get_flashed_messages() %}<div class="flash">{{m}}</div>{% endfor %}
{% block body %}{% endblock %}</main></body></html>
